name: Linters

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './tools'
          ignore_paths: 'tools/venv'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Flake8 Check
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 tools/*.py --count --select=E9,F63,F7,F82 --show-source --statistics
